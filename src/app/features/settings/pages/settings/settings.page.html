<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="backToFolders()" aria-label="Volver a carpetas">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="settings-container">
    <h1>Ajustes</h1>

    <ng-container *ngIf="user$ | async as user">
      <section class="profile-section">
        <div class="profile-avatar">{{ (user.email || 'J').charAt(0).toUpperCase() }}</div>
        <div>
          <h2>{{ user.displayName || 'Mi cuenta' }}</h2>
          <p>{{ user.email }}</p>
        </div>
      </section>
    </ng-container>

    <section class="settings-group appearance-group">
      <div class="group-heading">
        <ion-icon name="contrast-outline"></ion-icon>
        <div>
          <h2>Apariencia</h2>
          <p>Selecciona cómo quieres ver NoteChord</p>
        </div>
      </div>
      <div class="appearance-options" role="radiogroup" aria-label="Apariencia">
        <button type="button" role="radio" [class.selected]="appearance === 'light'" [attr.aria-checked]="appearance === 'light'" (click)="setAppearance('light')">
          <span class="theme-preview light-preview"><i></i><i></i></span>
          <span>Claro</span>
          <ion-icon *ngIf="appearance === 'light'" name="checkmark-circle"></ion-icon>
        </button>
        <button type="button" role="radio" [class.selected]="appearance === 'dark'" [attr.aria-checked]="appearance === 'dark'" (click)="setAppearance('dark')">
          <span class="theme-preview dark-preview"><i></i><i></i></span>
          <span>Oscuro</span>
          <ion-icon *ngIf="appearance === 'dark'" name="checkmark-circle"></ion-icon>
        </button>
        <button type="button" role="radio" [class.selected]="appearance === 'system'" [attr.aria-checked]="appearance === 'system'" (click)="setAppearance('system')">
          <span class="theme-preview system-preview"><i></i><i></i></span>
          <span>Sistema</span>
          <ion-icon *ngIf="appearance === 'system'" name="checkmark-circle"></ion-icon>
        </button>
      </div>
    </section>

    <section class="settings-list">
      <button type="button" (click)="showInformation('Sincronización', 'Tus carpetas y notas se sincronizan automáticamente mediante Cloud Firestore.')">
        <ion-icon name="sync-outline"></ion-icon>
        <span>Sincronización</span>
        <small>Automática</small>
        <i class="status-dot" aria-hidden="true"></i>
      </button>
      <button type="button" (click)="showInformation('Ayuda', 'Crea carpetas, añade notas y utiliza Vista para leer tus cifrados sin riesgo de editarlos.')">
        <ion-icon name="help-circle-outline"></ion-icon>
        <span>Ayuda</span>
        <ion-icon class="chevron" name="chevron-forward-outline"></ion-icon>
      </button>
      <button type="button" (click)="showInformation('Acerca de NoteChord', 'NoteChord · Notas musicales y cifrados.')">
        <ion-icon name="information-circle-outline"></ion-icon>
        <span>Acerca de</span>
        <ion-icon class="chevron" name="chevron-forward-outline"></ion-icon>
      </button>
    </section>

    <ion-button class="logout-button" expand="block" fill="clear" color="danger" (click)="logout()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      Cerrar sesión
    </ion-button>
  </main>
</ion-content>
