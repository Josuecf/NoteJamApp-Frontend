<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="backToNotes()" aria-label="Volver a notas">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Editor de nota</ion-title>
    <ion-buttons slot="end">
      <ion-button [disabled]="isSaving || isLoading" (click)="save()">
        <ion-icon slot="start" name="save-outline"></ion-icon>
        {{ isSaving ? 'Guardando...' : 'Guardar' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <main class="editor-container" *ngIf="!isLoading; else loadingState">
    <div class="note-context">
      <span class="context-icon"><ion-icon name="document-text-outline"></ion-icon></span>
      <span>Nota musical</span>
      <span class="context-dot">•</span>
      <span>Guardado manual</span>
    </div>

    <ion-input
      [(ngModel)]="title"
      (ngModelChange)="markDirty()"
      name="title"
      class="note-title"
      placeholder="Título"
      aria-label="Título de la nota"
    ></ion-input>

    <ion-textarea
      [(ngModel)]="content"
      (ngModelChange)="onContentChange()"
      name="content"
      class="note-content"
      placeholder="Escribe aquí tus acordes..."
      aria-label="Contenido de la nota"
      auto-grow="true"
    ></ion-textarea>

    <section class="sections-preview" *ngIf="sections.length">
      <div class="section-heading">
        <h2>Secciones</h2>
        <span>{{ sections.length }}</span>
      </div>
      <details *ngFor="let section of sections; let index = index" [open]="index === 0">
        <summary>{{ section.title }}</summary>
        <pre>{{ section.content }}</pre>
      </details>
    </section>

    <ion-text color="medium" aria-live="polite" *ngIf="isDirty">
      <p class="status-message">Cambios sin guardar</p>
    </ion-text>

    <ion-text color="success" aria-live="polite" *ngIf="statusMessage">
      <p class="status-message">{{ statusMessage }}</p>
    </ion-text>

    <ion-text color="danger" role="alert" *ngIf="errorMessage">
      <p class="status-message">{{ errorMessage }}</p>
    </ion-text>
  </main>

  <ng-template #loadingState>
    <p class="loading-message" aria-live="polite">Cargando nota...</p>
  </ng-template>
</ion-content>
