<ion-content>
  <main class="login-container">
    <section class="login-panel">
      <div class="brand-mark" aria-hidden="true">
        <ion-icon name="musical-notes-outline"></ion-icon>
      </div>

      <div class="brand-copy">
        <p class="eyebrow">Tu música siempre contigo</p>
        <h1>NoteChord</h1>
        <p>Inicia sesión para continuar</p>
      </div>

      <div class="login-form-wrapper">
        <form (ngSubmit)="login()">
          <ion-item>
            <ion-input
              [(ngModel)]="email"
              name="email"
              type="email"
              label="Correo electrónico"
              labelPlacement="stacked"
              autocomplete="email"
              required
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-input
              [(ngModel)]="password"
              name="password"
              type="password"
              label="Contraseña"
              labelPlacement="stacked"
              autocomplete="current-password"
              required
            ></ion-input>
          </ion-item>

          <ion-text color="danger" role="alert" *ngIf="errorMessage">
            <p class="error-message">{{ errorMessage }}</p>
          </ion-text>

          <ion-button expand="block" type="submit" [disabled]="isSubmitting || !email || !password">
            {{ isSubmitting ? 'Iniciando sesión...' : 'Iniciar sesión' }}
          </ion-button>
        </form>
      </div>
    </section>
  </main>
</ion-content>
